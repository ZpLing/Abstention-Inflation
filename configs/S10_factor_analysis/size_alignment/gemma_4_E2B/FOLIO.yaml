# S10 size & alignment on FOLIO for gemma-4-E2B: S1 and S2 at T=0 (greedy) on 250 True +
# 250 False items, 3072 new tokens, batch 8, as raw text (the base arm);
# a local checkpoint whose path is given on the command line (--model-path).
# Writes results/S10_factor_analysis/size_alignment/gemma_4_E2B/FOLIO_gemma-4-E2B.json.
experiment_name: "S10_size_alignment_FOLIO_gemma_4_E2B"
model_name: "gemma-4-E2B"
override_model: true

run_tasks: ['s10_size_alignment']

s10_size_alignment:
  datasets:
    - "FOLIO"
  settings: ["S1", "S2"]
  n_per_class: 250
  max_new_tokens: 3072
  batch_size: 8
  use_chat_template: false
  results_root: "results"
  model_slug: "gemma_4_E2B"
  # model_path: "/path/to/gemma-4-E2B"
