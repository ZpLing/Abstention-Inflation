# S10 size & alignment on FLD for gemma-4-31B-it: S1 and S2 at T=0 (greedy) on 250 True +
# 250 False items, 3072 new tokens, batch 8, through the chat template (the instruction-tuned arm);
# a local checkpoint whose path is given on the command line (--model-path).
# Writes results/S10_factor_analysis/size_alignment/gemma_4_31B_it/FLD_gemma-4-31B-it.json.
experiment_name: "S10_size_alignment_FLD_gemma_4_31B_it"
model_name: "gemma-4-31B-it"
override_model: true

run_tasks: ['s10_size_alignment']

s10_size_alignment:
  datasets:
    - "FLD"
  settings: ["S1", "S2"]
  n_per_class: 250
  max_new_tokens: 3072
  batch_size: 8
  use_chat_template: true
  results_root: "results"
  model_slug: "gemma_4_31B_it"
  # model_path: "/path/to/gemma-4-31B-it"
