# S10 positional bias on FOLIO for gpt-5.4-nano, abstain verb in the second slot
# (position B: the options read "True | Unknown | False"), on the full 500 items
# with the labels unified to True / False / Unknown; writes
# results/S10_factor_analysis/positional_bias/gpt_5.4_nano/FOLIO_gpt-5.4-nano_second.json.
experiment_name: "S10_positional_bias_FOLIO_second_gpt_5.4_nano"
model_name: "gpt-5.4-nano"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['s10_positional_bias']

s10_positional_bias:
  datasets:
    - "FOLIO"
  positions: ["B"]     # second slot
  unified_labels: true
  results_root: "results"
  model_slug: "gpt_5.4_nano"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
