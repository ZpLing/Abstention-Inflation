# S10 temperature sweep on FLD for the local Olmo-3-7B-Instruct checkpoint: S2 at six
# temperatures on 250 True + 250 False items, top-k 20 sampling, 8192 new tokens,
# batch 8, through the chat template; the checkpoint's path is given on the command
# line (--model-path). Writes
# results/S10_factor_analysis/temperature/olmo_3_7b_instruct/FLD_Olmo-3-7B-Instruct_T<t>.json.
experiment_name: "S10_temperature_local_FLD_olmo_3_7b_instruct"
model_name: "Olmo-3-7B-Instruct"
override_model: true

run_tasks: ['s10_temperature_local']

s10_temperature_local:
  datasets:
    - "FLD"
  temperatures: [0.0, 0.3, 0.7, 1.0, 1.5, 2.0]
  settings: ["S2"]
  n_per_class: 250
  max_new_tokens: 8192
  batch_size: 8
  top_k: 20
  use_chat_template: true
  results_root: "results"
  model_slug: "olmo_3_7b_instruct"
  # model_path: "/path/to/Olmo-3-7B-Instruct"
