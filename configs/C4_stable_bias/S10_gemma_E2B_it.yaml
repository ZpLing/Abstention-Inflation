# §5.2 Gemma IT vs base — instruction-tuned model run
# Goal: measure Abs Rate S1/S2 for gemma-4-E2B-it on FLD + FOLIO
# Endpoint: vLLM on <HOST> (<VLLM_HOST>:8081)
#
# Before running, start vLLM on <HOST>:
#   vllm serve <HOST_HOME>/<EXPDIR>/models/gemma-4-E2B-it \
#     --served-model-name gemma-4-E2B-it --port 8081 --max-model-len 4096
#
# Run:
#   python main.py --config configs/gemma_it_experiment.yaml

experiment_name: "gemma_it_s52"
override_model: true
model_name: "gemma-4-E2B-it"
dataset_name: "FLD"
max_workers: 32

run_tasks: ['s10_model_sweep']

s10_model_sweep:
  models:
    - name: "gemma-4-E2B-it"
      api_key: "EMPTY"
      base_url: "http://<VLLM_HOST>:8081/v1"
  datasets: ["FLD", "FOLIO"]
  ab_results_dir: "results/gemma_it_s52"
  results_dir:    "results/gemma_it_s52"

main_experiment:
  datasets: ["FLD", "FOLIO"]
  sample_limits:
    FLD:
      true:   100
      false: 100
    FOLIO:
      true:   100
      false: 100
  settings: ["S1", "S2"]
  run_s5_rerun: false
  results_dir: "results/gemma_it_s52"
  judge:
    enabled: false

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
