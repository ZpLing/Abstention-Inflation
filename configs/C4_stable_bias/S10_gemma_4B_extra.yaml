# §5.2 Gemma size+IT sweep — gemma-3-4b-it
experiment_name: "gemma_4b_it_s52"
override_model: true
model_name: "gemma-3-4b-it"
dataset_name: "FLD"
max_workers: 32

run_tasks: ['s10_model_sweep']

s10_model_sweep:
  models:
    - name: "gemma-3-4b-it"
      api_key: "EMPTY"
      base_url: "http://<VLLM_HOST>:8081/v1"
  datasets: ["FLD", "FOLIO"]
  ab_results_dir: "results/gemma_it_vs_base"
  results_dir:    "results/gemma_it_vs_base"

main_experiment:
  datasets: ["FLD", "FOLIO"]
  sample_limits:
    FLD:
      true:    100
      false: 100
    FOLIO:
      true:    100
      false: 100
  settings: ["S1", "S2"]
  run_s5_rerun: false
  results_dir: "results/gemma_it_vs_base"
  judge:
    enabled: false

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
