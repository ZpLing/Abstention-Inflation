# T-2A — Qwen3.5 size sweep (paper, paper §5.1)
# Goal: Abs Rate vs parameter count on FLD + FOLIO, same model family
# Endpoint: local Ollama (OpenAI-compatible at http://localhost:11434/v1)
#
# Run:
#   ollama serve   # if not already running
#   python main.py --config configs/qwen_size_sweep.yaml

experiment_name: "qwen_size_sweep_t2a"
override_model: true            # ignore `config` file's llm.model; per-entry below wins
model_name: "qwen3.5:0.8b"      # default; overridden per-entry by exp2_model_sweep
dataset_name: "FLD"
max_workers: 4                  # local Ollama; keep low to avoid OOM on M-series

run_tasks: ['s10_model_sweep']

# --- Per-model gradient (3 Qwen sizes, all via local Ollama) ---
s10_model_sweep:
  models:
    - {name: "qwen3.5:0.8b", api_key: "ollama", base_url: "http://localhost:11434/v1"}
    - {name: "qwen3.5:2b",   api_key: "ollama", base_url: "http://localhost:11434/v1"}
    - {name: "qwen3.5:4b",   api_key: "ollama", base_url: "http://localhost:11434/v1"}
  datasets: ["FLD", "FOLIO"]
  ab_results_dir: "results/qwen_size_sweep"   # per-model ABRunner summaries
  results_dir:    "results/qwen_size_sweep"   # cross-model aggregate

# --- ABRunner config (consumed once per model by the S10(c) sweep wrapper) ---
main_experiment:
  datasets: ["FLD", "FOLIO"]    # overridden by exp2_model_sweep.datasets
  sample_limits:
    FLD:
      true: 50
      false: 50
    FOLIO:
      true: 50
      false: 50
  run_s5_rerun: true           # S1 + S2 + S3 (PLAN says S1+S2+S3 optional)
  results_dir: "results/qwen_size_sweep"
  judge:
    enabled:     true
    model_name:  "gemini-2.5-flash-lite"   # judge stays on real API (cheap fallback)
    api_key:     null            # null → inherit from `config` (gateway llm.api_key)
    base_url:    null            # null → inherit from `config` (gateway llm.base_url)
    max_workers: 4

# --- Path templates (required by data_handler even if unused by ab_experiment) ---
paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
