# S9 Unknown-labeled perception: S1/S2/S3 on the Unknown-labeled subsets.
# Both files hold 300 items, and all of them are used.
experiment_name: "S9_unknown_labeled_nano"
model_name: "gpt-5.4-nano"
override_model: true
max_workers: 100

run_tasks: ['s9_unknown_labeled']

s9_unknown_labeled:
  datasets:
    - "FLD"
    - "FOLIO"
  results_dir: "results/S9_unknown_labeled/nano"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
