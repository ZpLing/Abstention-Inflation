experiment_name: "c4_selfdiag_gemini"
model_name: "gemini-3.1-flash-lite"
override_model: true
max_workers: 20

c4_selfdiag:
  datasets:
    - "FLD"
    - "FOLIO"
  batch_dirs:
    FLD:
      - "results/ab_gemini_flash_lite"
      - "results/ab_gemini_batch2"
    FOLIO:
      - "results/ab_gemini_flash_lite"
      - "results/ab_gemini_batch2"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
