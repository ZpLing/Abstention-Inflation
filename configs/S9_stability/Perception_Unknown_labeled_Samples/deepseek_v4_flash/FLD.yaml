# S9 Perception of Unknown-labeled items on FLD for deepseek-v4-flash: S1 / S2 / S3 on the
# 300 Unknown-labeled items of dataset/FLD_unknown.json, all of them used; writes
# results/S9_stability/Perception_Unknown_labeled_Samples/deepseek_v4_flash/.
experiment_name: "S9_Perception_Unknown_labeled_Samples_FLD_deepseek_v4_flash"
model_name: "deepseek-v4-flash"
override_model: true
max_workers: 100

run_tasks: ['s9_perception_unknown_labeled_samples']

s9_perception_unknown_labeled_samples:
  datasets:
    - "FLD"
  results_root: "results"
  model_slug: "deepseek_v4_flash"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
