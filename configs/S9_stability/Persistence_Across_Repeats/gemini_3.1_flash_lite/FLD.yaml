# S9 Persistence across repeats on FLD for gemini-3.1-flash-lite: the same S2 prompt re-drawn
# three times on the items this model's S2 cell abstained on, at the endpoint's
# own temperature (the one S2 ran under); writes
# results/S9_stability/Persistence_Across_Repeats/gemini_3.1_flash_lite/FLD_gemini-3.1-flash-lite.json.
experiment_name: "S9_Persistence_Across_Repeats_FLD_gemini_3.1_flash_lite"
model_name: "gemini-3.1-flash-lite"
override_model: true
max_workers: 30

run_tasks: ['s9_persistence_across_repeats']

s9_persistence_across_repeats:
  datasets:
    - "FLD"
  n_repeats: 3
  results_root: "results"
  model_slug: "gemini_3.1_flash_lite"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
