experiment_name: "logiqa_deepseek"
model_name: "deepseek-v4-flash"
override_model: true
max_workers: 100

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "LogiQA_200"
  sample_limits:
    LogiQA_200: 200
  run_s5_rerun: true
  results_dir: "results/ab_logiqa_deepseek"
paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
