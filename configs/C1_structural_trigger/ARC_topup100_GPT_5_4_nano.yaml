# ARC top-up: the 100 items of dataset/ARC.json this model had not been run
# on (it had 400 from the Apr/May batches). Item ids are listed next to the
# summary in the results dir; the subset file is regenerated by the run log.
experiment_name: "arc_topup100_nano"
model_name: "gpt-5.4-nano"
override_model: true
max_workers: 100

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "ARC"
  run_s5_rerun: true
  results_dir: "results/mcq_n500/ARC_topup_nano"
paths:
  raw_dataset_template: "/private/tmp/claude-501/-Users-timchef-EMNLP2026-Abstention-Inflation/8041400a-af0b-42a2-af61-6cd8a8a6826d/scratchpad/topup_datasets/{dataset_name}.json"
