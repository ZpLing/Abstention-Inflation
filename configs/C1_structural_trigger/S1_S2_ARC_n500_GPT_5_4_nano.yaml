# ARC at n=500 on gpt-5.4-nano, the model Table 1 names.
experiment_name: "arc_n500_nano"
model_name: "gpt-5.4-nano"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "ARC"
  run_s5_rerun: true
  results_dir: "results/mcq_n500/ARC_nano"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
