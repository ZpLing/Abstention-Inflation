experiment_name: "gemini_flash_lite_full_sweep"
model_name: "gemini-3.1-flash-lite"
override_model: true            # pin yaml model; inherit api_key / base_url from `config`
dataset_name: "FLD"
max_workers: 20

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "ARC-Easy_250"
    - "ARC-Challenge_250"
    - "MedQA"
    - "FLD"
    - "FOLIO"
    - "FEVER"
  sample_limits:
    ARC-Easy_250: 100
    ARC-Challenge_250: 100
    MedQA: 100
    FEVER: 100
    FLD:
      true: 50
      false: 50
    FOLIO:
      true: 50
      false: 50
  run_s5_rerun: true
  results_dir: "results/ab_gemini_flash_lite"
paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
