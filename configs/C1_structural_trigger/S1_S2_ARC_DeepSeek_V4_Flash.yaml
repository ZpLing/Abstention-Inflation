# ARC at n=500 on deepseek-v4-flash, the model Table 1 names.
experiment_name: "main_experiment_mcq_ARC_deepseek_v4_flash"
model_name: "deepseek-v4-flash"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "ARC"
  run_s5_rerun: true
  results_root: "results"
  model_slug: "deepseek_v4_flash"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
