# S4 Word Content Ablation, random-word half: the third option becomes
# "Triangular" / "Cerulean", words with no bearing on the task. Any abstention
# into that slot is attributable to the slot, not to what it says.
experiment_name: "s4_random_words_dsv4flash"
model_name: "deepseek-v4-flash"
override_model: true
max_workers: 100

run_tasks: []

random_perturbation_control:
  datasets:
    - "FLD"
    - "FOLIO"
  n_per_class: 250          # 250 True + 250 False = the full 500 per dataset
  results_dir: "results/random_perturbation_control"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
