# LogiQA at n=500 on gemini-3.1-flash-lite, the model Table 1 names.
experiment_name: "logiqa_gemini31"
model_name: "gemini-3.1-flash-lite"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "LogiQA"
  run_s5_rerun: true
  results_dir: "results/mcq/LogiQA_gemini31"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
