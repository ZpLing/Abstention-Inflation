experiment_name: "gpt5_nano_full_sweep"
model_name: "gpt-5.4-nano"
override_model: true            # pin yaml model; inherit api_key / base_url from `config`
dataset_name: "FLD"
max_workers: 50

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "ARC-Easy_250"
    - "ARC-Challenge_250"
    - "MedQA"
    - "FLD"
    - "FOLIO"
    - "FEVER"
  sample_limits:
    ARC-Easy_250: 100
    ARC-Challenge_250: 100
    MedQA: 100
    FEVER: 100
    FLD:
      true: 50
      false: 50
    FOLIO:
      true: 50
      false: 50
  run_s5_rerun: true
  results_dir: "results/ab_gpt5_nano"
  judge:
    enabled:     true
    model_name:  "gemini-2.5-flash"
    api_key:     null
    base_url:    null
    max_workers: 5

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
