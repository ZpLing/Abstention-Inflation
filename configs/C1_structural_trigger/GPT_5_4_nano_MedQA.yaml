experiment_name: "nano_medqa_step_250"
model_name: "gpt-5.4-nano"
override_model: true
dataset_name: "FLD"
max_workers: 50

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "MedQA-Step1"
    - "MedQA-Step2_3"
  sample_limits:
    MedQA-Step1: 250
    MedQA-Step2_3: 250
  run_s5_rerun: true
  results_dir: "results/ab_nano_medqa250"
paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
