# S3 Question format ablation on FOLIO for gpt-5.4-nano: the S2 ternary rendered as
# A / B / C, TFQ only, collected in the same pass as the S1/S2 it is scored
# against; writes results/S3_question_format/gpt_5.4_nano/FOLIO_gpt-5.4-nano.json.
experiment_name: "S3_question_format_FOLIO_gpt_5.4_nano"
model_name: "gpt-5.4-nano"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "FOLIO"
  settings: ['S1', 'S2', 'S3']
  run_s5_rerun: false
  results_root: "results"
  model_slug: "gpt_5.4_nano"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
