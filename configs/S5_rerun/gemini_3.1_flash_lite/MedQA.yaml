# S5 Without-Unknown rerun on MedQA for gemini-3.1-flash-lite: the items S2 abstained on, asked
# again without the option, inside the S1/S2 pass; writes
# results/S5_rerun/mcq/gemini_3.1_flash_lite/MedQA_gemini-3.1-flash-lite.json.
experiment_name: "S5_rerun_MedQA_gemini_3.1_flash_lite"
model_name: "gemini-3.1-flash-lite"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "MedQA"
  settings: ['S1', 'S2']
  run_s5_rerun: true
  results_root: "results"
  model_slug: "gemini_3.1_flash_lite"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
