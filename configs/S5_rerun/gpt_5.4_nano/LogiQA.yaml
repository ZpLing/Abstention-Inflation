# S5 Without-Unknown rerun on LogiQA for gpt-5.4-nano: the items S2 abstained on, asked
# again without the option, inside the S1/S2 pass; writes
# results/S5_rerun/mcq/gpt_5.4_nano/LogiQA_gpt-5.4-nano.json.
experiment_name: "S5_rerun_LogiQA_gpt_5.4_nano"
model_name: "gpt-5.4-nano"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "LogiQA"
  settings: ['S1', 'S2']
  run_s5_rerun: true
  results_root: "results"
  model_slug: "gpt_5.4_nano"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
