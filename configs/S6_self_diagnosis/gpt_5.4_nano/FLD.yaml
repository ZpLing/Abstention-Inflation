# S6 Self-Diagnosis on FLD for gpt-5.4-nano: replay the S2 conversation on each
# Abstention Inflation item and ask the model to attribute its own abstention to
# (A) being unable to work it out or (B) the item being objectively unanswerable.
# Reads this model's S1, S2 and S5 cells; writes results/S6_self_diagnosis/gpt_5.4_nano/.
experiment_name: "S6_self_diagnosis_FLD_gpt_5.4_nano"
model_name: "gpt-5.4-nano"
override_model: true
max_workers: 100

run_tasks: ['s6_self_diagnosis']

s6_self_diagnosis:
  datasets:
    - "FLD"
  results_root: "results"
  model_slug: "gpt_5.4_nano"
  task_type: "tf"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
