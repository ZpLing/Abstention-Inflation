# S1 Baseline on LogiQA for gpt-5.4-nano: the task's own labels, no extra option.
# The paired pass with only S1 active; writes results/S1_baseline/mcq/gpt_5.4_nano/LogiQA_gpt-5.4-nano.json.
experiment_name: "S1_baseline_LogiQA_gpt_5.4_nano"
model_name: "gpt-5.4-nano"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "LogiQA"
  settings: ['S1']
  run_s5_rerun: false
  results_root: "results"
  model_slug: "gpt_5.4_nano"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
