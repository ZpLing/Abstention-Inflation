# S1 Baseline on FLD for gemini-3.1-flash-lite: the task's own labels, no extra option.
# The paired pass with only S1 active; writes results/S1_baseline/tfq/gemini_3.1_flash_lite/FLD_gemini-3.1-flash-lite.json.
experiment_name: "S1_baseline_FLD_gemini_3.1_flash_lite"
model_name: "gemini-3.1-flash-lite"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['main_experiment']

main_experiment:
  datasets:
    - "FLD"
  settings: ['S1']
  run_s5_rerun: false
  results_root: "results"
  model_slug: "gemini_3.1_flash_lite"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
