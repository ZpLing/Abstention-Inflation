experiment_name: "c4_selfdiag_nano"
model_name: "gpt-5.4-nano"
override_model: true
max_workers: 50

c4_selfdiag:
  datasets:
    - "FLD"
    - "FOLIO"
  batch_dirs:
    FLD:
      - "results/ab_gpt5_nano"
      - "results/ab_nano_batch2"
    FOLIO:
      - "results/ab_gpt5_nano"
      - "results/ab_nano_batch2"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
