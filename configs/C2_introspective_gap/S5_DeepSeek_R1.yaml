experiment_name: "r1_logit_calibration_deepseek"
model_name: "deepseek-r1-distill-llama-8b"
override_model: true             # pin model from yaml; inherit api_key/base_url from `config`
max_workers: 50
max_tokens: 4

# Falls back to secrets.yaml at project root if api_key/base_url omitted here;
# falls back to OPENAI_API_KEY / OPENAI_BASE_URL env vars after that.

r1_experiment:
  datasets:
    - "FLD"
    - "FOLIO"
    - "FEVER"
  n_samples: 100
  calib_split: 0.5
  cot_max_tokens: 2048
  results_dir: "results/remedy_r1"
