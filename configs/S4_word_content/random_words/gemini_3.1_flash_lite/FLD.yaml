# S4 Word Content Ablation, random-word half, on FLD for gemini-3.1-flash-lite: the third
# option becomes "Triangular" / "Cerulean", words with no bearing on the task, so
# any abstention into that slot is attributable to the slot, not to what it says.
# Reads this model's S1 and S2 cells; writes results/S4_word_content/random_words/gemini_3.1_flash_lite/.
experiment_name: "S4_random_words_FLD_gemini_3.1_flash_lite"
model_name: "gemini-3.1-flash-lite"
override_model: true
max_workers: 100

run_tasks: ['s4_random_words']

s4_random_words:
  datasets:
    - "FLD"
  n_per_class: 250          # 250 True + 250 False = the full 500
  results_root: "results"
  model_slug: "gemini_3.1_flash_lite"      # S1 and the Unknown condition come from this model's main-table cells

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
