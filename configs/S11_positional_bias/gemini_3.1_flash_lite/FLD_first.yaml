# S11 Positional biases on FLD for gemini-3.1-flash-lite, abstain verb in the first slot
# (position A: the options read "Unknown | True | False"), on the full 500 items
# with the labels unified to True / False / Unknown; writes
# results/S11_positional_bias/gemini_3.1_flash_lite/FLD_gemini-3.1-flash-lite_first.json.
experiment_name: "S11_positional_bias_FLD_first_gemini_3.1_flash_lite"
model_name: "gemini-3.1-flash-lite"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['s11_positional_biases']

s11_positional_biases:
  datasets:
    - "FLD"
  positions: ["A"]     # first slot
  unified_labels: true
  results_root: "results"
  model_slug: "gemini_3.1_flash_lite"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
