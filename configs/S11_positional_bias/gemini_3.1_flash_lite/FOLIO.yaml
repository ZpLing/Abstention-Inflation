# S11 Positional biases on FOLIO for gemini-3.1-flash-lite: the abstain verb in slot A / B / C
# of the S2 prompt, on the full 500 items with the labels unified to
# True / False / Unknown; writes results/S11_positional_bias/gemini_3.1_flash_lite/.
experiment_name: "S11_positional_bias_FOLIO_gemini_3.1_flash_lite"
model_name: "gemini-3.1-flash-lite"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['s11_positional_biases']

s11_positional_biases:
  datasets:
    - "FOLIO"
  positions: ["A", "B", "C"]
  unified_labels: true
  results_root: "results"
  model_slug: "gemini_3.1_flash_lite"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
