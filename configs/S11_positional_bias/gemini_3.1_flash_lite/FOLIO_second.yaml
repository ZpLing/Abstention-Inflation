# S11 Positional biases on FOLIO for gemini-3.1-flash-lite, abstain verb in the second slot
# (position B: the options read "True | Unknown | False"), on the full 500 items
# with the labels unified to True / False / Unknown; writes
# results/S11_positional_bias/gemini_3.1_flash_lite/FOLIO_gemini-3.1-flash-lite_second.json.
experiment_name: "S11_positional_bias_FOLIO_second_gemini_3.1_flash_lite"
model_name: "gemini-3.1-flash-lite"
override_model: true
max_workers: 100
max_retries: 3

run_tasks: ['s11_positional_biases']

s11_positional_biases:
  datasets:
    - "FOLIO"
  positions: ["B"]     # second slot
  unified_labels: true
  results_root: "results"
  model_slug: "gemini_3.1_flash_lite"

paths:
  raw_dataset_template: "dataset/{dataset_name}.json"
